<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Page Not Found — Golden-Egg</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #070707;
      --text: #f5f5f5;
      --muted: #999;
      --gold: #f4c95d;
      --gold-light: #ffe7a3;
      --border: #292929;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
      color: var(--text);
      background:
        radial-gradient(circle at top, #1b1608 0%, var(--bg) 45%),
        var(--bg);
    }

    .container {
      width: min(650px, 100%);
    }

    .egg {
      width: 120px;
      height: 150px;
      margin: 0 auto 30px;
      border-radius: 48% 48% 45% 45%;
      background: linear-gradient(
        145deg,
        #fff1a8 0%,
        #f4c95d 30%,
        #b98b20 70%,
        #6e5112 100%
      );
      box-shadow:
        0 0 30px rgba(244, 201, 93, 0.18),
        inset -18px -20px 30px rgba(0, 0, 0, 0.2),
        inset 15px 12px 22px rgba(255, 255, 255, 0.22);
      transform: rotate(-5deg);
    }

    .code {
      font-size: 5rem;
      line-height: 1;
      color: var(--gold);
      letter-spacing: 4px;
      margin-bottom: 15px;
      font-weight: bold;
    }

    h1 {
      font-size: clamp(2rem, 6vw, 3.5rem);
      margin-bottom: 15px;
    }

    p {
      max-width: 520px;
      margin: 0 auto;
      color: var(--muted);
      line-height: 1.7;
    }

    .button-group {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 30px;
    }

    a {
      display: inline-block;
      padding: 11px 17px;
      border: 1px solid #414141;
      border-radius: 9px;
      background: #161616;
      color: var(--gold);
      text-decoration: none;
      font-size: 0.9rem;
    }

    a:hover {
      background: #222;
      border-color: #665522;
    }

    .footer {
      margin-top: 35px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      color: #666;
      font-size: 0.8rem;
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="egg" aria-hidden="true"></div>

    <div class="code">404</div>

    <h1>Golden-Egg Not Found</h1>

    <p>
      The page you are looking for does not exist or may have moved.
      You can return to the Golden-Egg Gallery or explore the project.
    </p>

    <div class="button-group">

      <a href="index.html">
        🖼️ Back to Gallery
      </a>

      <a href="about.html">
        ℹ️ About Project
      </a>

      <a
        href="https://github.com/mohammadyadollahi-netizen/golden-egg-gallery"
        target="_blank"
        rel="noopener"
      >
        GitHub
      </a>

    </div>

    <div class="footer">
      Golden-Egg · Digital Art NFT Collection
    </div>

  </main>

</body>
